services:
  - type: web
    name: typerush
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/typing-battles.db
    disk:
      name: typerush-data
      mountPath: /var/data
      sizeGB: 1
